services:
  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - cache-store
    networks:
      - app-network
    ports:
      - '80:8080'
      - '443:8443'

  db:
    image: mysql:8.1.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - '6000:3306'
    volumes:
      - type: volume
        source: db-vol
        target: /var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-network

  # Caching
  cache-store:
    image: redis:7.2.1-alpine
    restart: unless-stopped
    volumes:
      - cache-store-vol:/data # Old syntax for named volume mount. Prefer the new one (db-dev, db-test)
    ports:
      - '6379:6379'
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-vol:
  cache-store-vol:
