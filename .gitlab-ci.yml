stages:
  - test

phpunit:
  image:
    name: "serversideup/php:8.2-fpm-nginx"
    docker:
      user: root
  stage: test
  before_script:
    - php -v
    - install-php-extensions intl
    - echo "Installed intl PHP Extension"
    - echo "$WEBKIT_TESTING_ENV" > ".env.testing"
    - composer install
    - echo "Composer install completed"
  script:
    - php artisan test
