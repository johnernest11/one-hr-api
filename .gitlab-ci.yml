stages:
  - test

phpunit:
  image: "serversideup/php:8.2-fpm-nginx"
  stage: test
  before_script:
    - php -v
    - whoami
    - su root
    - whoami
    - install-php-extensions intl
    - echo "Installed intl PHP Extension"
    - echo "$WEBKIT_TESTING_ENV" > ".env.testing"
    - composer install
    - echo "Composer install completed"
  script:
    - php artisan test
