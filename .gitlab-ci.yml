stages:
    - test
    - build
    - prepare-db
    - deploy

variables:
  IMAGE_BASE_NAME: jegramos/webkit-php:v1.1
  IMAGE_API_NAME: jegramos/webkit-api

phpunit:
  image: $IMAGE_BASE_NAME
  stage: test
  services:
    - mysql:8.1.0
  variables:
     MYSQL_DATABASE: $WEBKIT_TESTING_DB_NAME
     MYSQL_ROOT_PASSWORD:  $WEBKIT_TESTING_DB_PASSWORD
  before_script:
    - cp $WEBKIT_TESTING_ENV .env
    - cp $WEBKIT_TESTING_ENV .env.testing
    - composer install
  script:
    - php artisan test

code-security-checker:
  image: $IMAGE_BASE_NAME
  stage: test
  before_script:
    - cp $WEBKIT_TESTING_ENV .env
    - composer install
  script:
    - php vendor/bin/security-checker security:check ./composer.lock

docker:
  image: docker:26.1.4-cli
  stage:  build
  services:
    - name: docker:26.1.4-dind
      alias: docker-daemon
  variables:
    # Tell docker CLI how to talk to Docker daemon; see
    # https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#use-docker-in-docker-executor
    DOCKER_HOST: tcp://docker-daemon:2375/
    # Use the overlays driver for improved performance:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - cp $WEBKIT_DEVELOPMENT_ENV .env
    - docker login -u $IMAGE_REGISTRY_USER -p $IMAGE_REGISTRY_PASSWORD
  script:
    # Build the container with .env as a secret file
    - DOCKER_BUILDKIT=1 docker build -t jegramos/webkit-api -f app.Dockerfile --secret id=_env,source=.env .
    - docker push $IMAGE_API_NAME

migrations-and-seeders:
  image: $IMAGE_BASE_NAME
  stage: prepare-db
  before_script:
    - cp $WEBKIT_DEVELOPMENT_INIT_DB_ENV .env
    - composer install --no-dev
  script:
    # Migration and seeders are Idempotent (meaning we can run them multiple times without side-effects)
    - php artisan migrate --seed --force

docker-compose:
  stage: deploy
  variables:
    CONFIG_DIR_NAME: app-config
  before_script:
    - chmod 400 $WEBKIT_DEVELOP_PEM_KEY 
    - cp $WEBKIT_DEVELOPMENT_ENV .env
    # Create the directory where the docker-compose.yml and .env will reside  
    - ssh -o StrictHostKeyChecking=no -i $WEBKIT_DEVELOP_PEM_KEY ec2-user@$WEBKIT_DEVELOPMENT_SERVER_IP "mkdir -p '$CONFIG_DIR_NAME'/docker-configs"
    # Copy the docker-compose.yml and .env to the server in the app-config dir
    - scp -o StrictHostKeyChecking=no -i $WEBKIT_DEVELOP_PEM_KEY docker-compose.yml .env ec2-user@$WEBKIT_DEVELOPMENT_SERVER_IP:~/$CONFIG_DIR_NAME/
    # Copy the 99-api-entrypoint.sh to the server in the app-config/docker-configs dir
    - scp -o StrictHostKeyChecking=no -i $WEBKIT_DEVELOP_PEM_KEY ./docker-configs/99-api-entrypoint.sh ec2-user@$WEBKIT_DEVELOPMENT_SERVER_IP:~/$CONFIG_DIR_NAME/docker-configs
  script:
    # SSH to the server and build the app containers via docker compose
    - ssh -o StrictHostKeyChecking=no -i $WEBKIT_DEVELOP_PEM_KEY ec2-user@$WEBKIT_DEVELOPMENT_SERVER_IP "
        docker login -u '$IMAGE_REGISTRY_USER' -p '$IMAGE_REGISTRY_PASSWORD' &&
        cd $CONFIG_DIR_NAME &&
        docker-compose --profile app down &&
        docker-compose --profile app pull &&
        docker-compose --profile app build &&
        docker-compose --profile app up -d
      "
