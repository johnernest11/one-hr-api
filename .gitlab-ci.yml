stages:
  - test

phpunit:
  image: "jegramos/webkit-php:v1.0"
  stage: test
  before_script:
    - cp $WEBKIT_TESTING_ENV .env.testing
    -  cat $WEBKIT_TESTING_ENV
    - echo "Created .env.testing"
    - cat .env.testing
    - composer install
    - echo "Composer install completed"
  script:
    - php artisan test
